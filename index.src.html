  else ay=H*(.42+.3*Math.sin(k*.23+1));

 var L=[];for(var i=0;i<N.length;i++){var n=N[i],a=(now-n.born)/n.life;if(a>=1)continue;n.x+=n.vx;n.y+=n.vy;

/* ================= marketplaces ================= */
const PLATFORMS = [
  ['transient.xyz','Transient','ETH'],['opensea.io','OpenSea',null],['foundation.app','Foundation','ETH'],['superrare.com','SuperRare','ETH'],
  ['objkt.com','objkt','Tezos'],['teia.art','Teia','Tezos'],['fxhash.xyz','fxhash',null],['zora.co','Zora','Base'],['manifold.xyz','Manifold','ETH'],
  ['exchange.art','Exchange.art','Solana'],['magiceden.io','Magic Eden',null],['magiceden.us','Magic Eden',null],['tensor.trade','Tensor','Solana'],
  ['highlight.xyz','Highlight',null],['rarible.com','Rarible',null],['knownorigin.io','KnownOrigin','ETH'],['makersplace.com','MakersPlace','ETH'],
  ['niftygateway.com','Nifty Gateway','ETH'],['verse.works','Verse','ETH'],['gamma.io','Gamma','Bitcoin'],['ordinals.com','Ordinals','Bitcoin'],
  ['mint.fun','mint.fun',null],['sound.xyz','Sound','ETH'],['async.art','Async','ETH'],['art.art','Art.art',null],['deca.art','Deca',null],
  ['oncyber.io','oncyber',null],['scatter.art','Scatter','ETH'],['showtime.xyz','Showtime',null],['rodeo.club','Rodeo','Base'],['vv.xyz','VV','ETH'],

  ['ipfs.io','IPFS',null],['etherscan.io','Etherscan','ETH'],['basescan.org','Basescan','Base'],

function platformOf(url){
  let h=''; try{ const u=new URL(url); if(!/^https?:$/.test(u.protocol)) return null; h=u.hostname.replace(/^www\./,''); }catch{ return null; }
  if (/(^|\.)(x|twitter)\.com$|t\.co$/.test(h)) return null;
  for (const [d,name,chain] of PLATFORMS) if (h===d || h.endsWith('.'+d) || h.includes(d)) return {name,chain,host:h,known:true};
  return {name:h.split('.').slice(-2,-1)[0]||h, chain:null, host:h, known:false};

/* ================= parsing a comment ================= */
const RX = {
  price: /(?:^|[\s:(@])(?:Ξ\s?(\d+(?:\.\d+)?)|(\d+(?:\.\d+)?)\s?(eth|weth|Ξ|tez|xtz|ꜩ|sol|◎|btc|sats|usdc|usd)\b|\$\s?(\d+(?:\.\d+)?))/i,

  chain: [[/\btezos\b|\btez\b|\bxtz\b|ꜩ/i,'Tezos'],[/\bsolana\b|\bsol\b|◎/i,'Solana'],[/\bbase\b|onchain summer/i,'Base'],[/\bbitcoin\b|\bordinals?\b|\bbtc\b|\bsats\b/i,'Bitcoin'],[/\bethereum\b|\beth\b|Ξ|\bweth\b/i,'ETH']],

function usdOf(p){ return p&&p.cur!=='USD'&&LIVE[p.cur] ? p.val*LIVE[p.cur] : null; }   // rough, only for comparing prices across chains

function enrich(x){
  const t = x.text||'';
  // price
  const m = t.match(RX.price); let price=null;
  if (m){ const val=+(m[1]||m[2]||m[4]); const cur = m[1]?'ETH': m[4]?'USD' : CUR[(m[3]||'').toLowerCase()]||CUR[m[3]]||'ETH';
    if (val>0 && val<1e7) price={val,cur,usd:val*(USD[cur]||1),label:(cur==='USD'?'$'+val:val+' '+cur)}; }
  // edition
  let ed=null; if (RX.oneOfOne.test(t)) ed='1/1'; else { const e=t.match(RX.edition); if(e) ed = /open|OE/i.test(e[0])?'open ed.':'ed. '+(e[1]||e[2]); }
  // links → platform
  const seen=new Set();
  const links=(x.links||[]).map(u=>typeof u==='string'?{url:u,p:platformOf(u)}:u).filter(l=>{ if(!l.p) return false;
    let k; try{ const q=new URL(l.url); k=q.hostname.replace(/^www\./,'').toLowerCase()+decodeURIComponent(q.pathname).replace(/\/+$/,'').toLowerCase(); }catch(_){ k=l.url; }
    if(seen.has(k)) return false; seen.add(k); return true; });
  links.sort((a,b)=>(b.p.known?1:0)-(a.p.known?1:0));
  const buy = links[0]||null;
  // chain
  let chain = buy&&buy.p.chain || null;
  if (!chain) for (const [r,c] of RX.chain) if (r.test(t)) { chain=c; break; }
  if (!chain && price) chain = {ETH:'ETH',XTZ:'Tezos',SOL:'Solana',BTC:'Bitcoin',sats:'Bitcoin'}[price.cur]||null;
  const sale = RX.auction.test(t) ? 'auction' : (RX.buynow.test(t) || (buy && (price || (ed && ed!=='1/1')))) ? 'buy now' : null;
  const mentions=(t.match(/@\w+/g)||[]).length, tags=(t.match(/#\w+/g)||[]).length;
  return Object.assign(x,{sale,price,ed,links,buy,chain,platform:buy?buy.p.name:null,spammy:RX.spam.test(t)||mentions+tags>6});
}

/* ================= smart scoring ================= */
const VRANK = {business:3, government:3, blue:2, none:0};
function pct(items, key, out){ const s=items.slice().sort((a,b)=>a[key]-b[key]); const n=Math.max(1,s.length-1); s.forEach((x,i)=>x[out]=i/n); }
function score(items){
  const now=Date.now(); const seen={};
  const byTime=items.slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  byTime.forEach((x,i)=>{ const u=x.author.username; x._dupe = seen[u]?1:0; seen[u]=1; x._order=i; });
  items.forEach(x=>{
    const eng = x.likes + 2*x.reposts + 0.5*x.replies + 3*(x.quotes||0) + 2*(x.bookmarks||0);
    const f = x.author.followers||0;
    const hours = Math.max(0,(now-new Date(x.created_at))/36e5);
    const quality = Math.log1p(eng);                                  // how much the thread liked it
    const punch = Math.log1p(eng / Math.log10(f+10));                 // engagement relative to reach
    const ready = x.buy ? (x.buy.p.known?1.2:0.6) : 0;                // can be collected right now
    const info = (x.price?0.35:0) + (x.ed?0.25:0) + (x.chain?0.1:0);  // artist gave real details
    const fresh = 0.4*Math.exp(-hours/24);
    const penalty = (x._dupe?0.9:0) + (x.text.length<4&&!x.buy?0.2:0);
    const spamK = x.spammy?0.35:1;
    x._eng = eng;
    x._smart = (0.9*quality + 1.2*punch + ready + info + fresh) * spamK - penalty;   // spammy replies sink
    x._gem = f<3000 && punch>1.4 && !x.spammy;
    x._gemScore = (punch*1.5 + ready*0.5 - Math.log10(f+10)*0.4) * spamK - (x._dupe?1:0);
    x._pop = (quality*1.2 + Math.log10(f+10)*0.45) * spamK - (x._dupe?0.4:0);
    x._rise = Math.log1p(eng) - 1.2*Math.log(hours+2) + (x.spammy?-2:0);
    x._talk = x.replies + 2*(x.quotes||0);
  });
  pct(items,'_smart','_pS'); pct(items,'_gemScore','_pG'); pct(items,'_pop','_pP');
}

  return `<svg class="vf" viewBox="0 0 24 24" aria-label="verified"><path fill="${c}" d="M22.5 12.5c0-1.58-.88-2.95-2.18-3.65.15-.44.23-.91.23-1.4 0-2.21-1.71-4-3.82-4-.47 0-.92.08-1.34.25C14.77 2.38 13.48 1.5 12 1.5s-2.77.88-3.38 2.2c-.42-.17-.87-.25-1.34-.25-2.11 0-3.82 1.79-3.82 4 0 .49.08.96.23 1.4C2.38 9.55 1.5 10.92 1.5 12.5c0 1.5.8 2.8 1.98 3.52-.02.16-.03.32-.03.48 0 2.21 1.71 4 3.82 4 .47 0 .92-.08 1.34-.25.61 1.32 1.9 2.25 3.39 2.25s2.78-.93 3.39-2.25c.42.17.87.25 1.34.25 2.11 0 3.82-1.79 3.82-4 0-.16-.01-.32-.03-.48 1.18-.72 1.98-2.02 1.98-3.52z"/><path fill="#000" d="M10.5 16.2l-3.7-3.7 1.4-1.4 2.3 2.3 5.3-5.3 1.4 1.4z"/></svg>`; }

/* ================= data ================= */
async function fetchPage(){
  if (DEMO) return demoPage();
  const key = localStorage.getItem('ss:key')||'';
  const r = await fetch(`${API}?id=${S.id}${S.next?'&next='+encodeURIComponent(S.next):''}`, {headers:key?{'x-access-key':key}:{}});
  if (r.status===401){ const k=prompt('access key'); if(k){localStorage.setItem('ss:key',k); return fetchPage();} throw new Error('access key needed'); }
  const j = await r.json().catch(()=>({error:'server error'})); if(!r.ok) throw new Error(j.error||'something went wrong');

}
async function load(){
  if (S.loading) return; S.loading=true; $('#go').disabled=true; $('#more').hidden=true;
  try{
    do{
      const j = await fetchPage();
      if (j.root && !S.root){ S.root=j.root; drawRoot(); }
      if (j.source==='fxtwitter') S.free=true;
      if (j.more==='pending') S.morePending=true;
      const ids = new Set(S.items.map(x=>x.id));
      (j.items||[]).forEach(x=>{ if(!ids.has(x.id)) S.items.push(enrich(x)); });
      S.next = j.next||null; S.pages++;
      $('#prog').style.width = S.next ? Math.min(95, S.pages/PAGE_CAP*100)+'%' : '100%';
      score(S.items); drawChips(); render();
    } while (S.next && S.pages < PAGE_CAP);
  }catch(e){ $('#err').textContent = e.message; }
  S.loading=false; $('#go').disabled=false; $('#more').hidden = !S.next;
  render();
  if (S.morePending) pollMore();
  setTimeout(()=>{ if(!S.next) $('#prog').style.width='0'; }, 800);
}

/* extra replies (Apify) arrive in the background */
async function pollMore(){
  const id=S.id; S.morePending=false; const note=$('#morenote'); note.hidden=false; note.textContent='finding more replies…';
  for (let i=0;i<30;i++){
    await new Promise(r=>setTimeout(r,i?8000:20000)); if (S.id!==id) return;
    let j; try{ j=await (await fetch(SSB+'/api/more?id='+id)).json(); }catch(e){ continue; }
    if (j.pending) continue;
    const host=S.root&&S.root.author&&S.root.author.username, ids=new Set(S.items.map(x=>x.id)); let n=0;
    (j.items||[]).forEach(x=>{ if(!ids.has(x.id)&&x.author.username!==host){ S.items.push(enrich(x)); n++; } });
    if (n){ score(S.items); drawChips(); render(); }
    note.textContent = n ? `+${n} more replies` : ''; setTimeout(()=>{ note.hidden=true; },4000); return;
  }
  note.hidden=true;
}

function pass(x){

  const np=ids.filter(k=>S.favs[k].price).length;   // total only counts pieces that state a price, and says so (user, 2026-10-24)
  $('#dclr').hidden=!n; $('#dsum').textContent = `${n} piece${n===1?'':'s'}`+(!sum?'':np===n?` · total ${sum}`:` · ${np} priced: ${sum}`);
  $('#dlist').innerHTML = n ? ids.map(k=>{ const f=S.favs[k]; return `<div class="ditem" data-id="${esc(k)}">
      <img src="${esc(f.thumb||'')}" alt="" loading="lazy">
      <div style="min-width:0"><b>${esc(f.name||f.u)}</b><span class="mono">${esc([f.plat,f.price&&f.price.label,f.ed].filter(Boolean).join(' · ')||'@'+f.u)}</span></div>
      ${f.buy?`<a class="buy" href="${esc(f.buy)}" target="_blank" rel="noopener">collect ↗</a>`:`<a class="buy ghost" href="${esc(f.url)}" target="_blank" rel="noopener">x ↗</a>`}
      <button class="rm" title="remove from list" aria-label="remove">✕</button>
    </div>`; }).join('') : '<p class="mono" style="padding:30px 4px">tap ♥ on any piece to add it here.</p>';
}
function unfav(id){ const x=S.items.find(i=>i.id===id);
  if(x) fav(x); else { delete S.favs[id]; try{localStorage.setItem('ss:favs',JSON.stringify(S.favs));}catch(_){} drawChips(); drawList(); } }
$('#dlist').onclick=e=>{ const b=e.target.closest('.rm'); if(!b) return; const it=b.closest('.ditem'); const id=it.dataset.id;
  it.classList.add('out'); setTimeout(()=>unfav(id),260); };
$('#dclr').onclick=()=>{ if(!confirm('remove everything from your collect list?')) return; Object.keys(S.favs).forEach(id=>{ const x=S.items.find(i=>i.id===id); delete S.favs[id];
  const el=x&&S.els.get(x.id); if(el) el.querySelector('.fav').classList.remove('on'); });
  document.querySelectorAll('.slide .add.on').forEach(b=>b.classList.remove('on'));
  try{localStorage.setItem('ss:favs',JSON.stringify(S.favs));}catch(_){} drawChips(); drawList(); };
$('#thm').onclick=()=>{ const r=document.documentElement, l=r.dataset.theme!=='light'; if(l) r.dataset.theme='light'; else delete r.dataset.theme; try{localStorage.setItem('ss:theme',l?'light':'dark');}catch(_){} };
$('#cl').onclick=()=>$('#drawer').classList.add('open'); $('#dx').onclick=()=>$('#drawer').classList.remove('open');

/* ================= feed ================= */
function renderFeed(){
  const f=$('#feed'); const keep=f.hidden?0:f.scrollTop;
  const label=(SORTS.find(s=>s[0]===S.sort)||[0,S.sort])[1];
  f.innerHTML = `<div class="ftop"><button class="pill" id="fx">✕</button><span class="mono">${esc(label)} · <span id="fi">1</span>/${S.view.length}</span></div>` +
    S.view.map((x,i)=>{ const m=x.media[0]; return `<section class="slide" data-id="${esc(x.id)}" data-i="${i}">
      <div class="blur" style="background-image:url('${esc(m.thumb||m.url)}')"></div>
      ${mainOf(m,i)}
      ${x.media.length>1?`<span class="mcount">1/${x.media.length}</span>`:''}
      <div class="pop">♥</div>
      <div class="meta">${whoOf(x,' · '+ago(x.created_at))}
        ${tagsOf(x)?`<div class="tags">${tagsOf(x)}</div>`:''}
        ${shortTxt(x)?`<p class="txt">${esc(shortTxt(x))}</p>`:''}
        <div class="fbtns"><button class="add ${S.favs[x.id]?'on':''}" title="add to collect list" aria-label="add to collect list" aria-pressed="${S.favs[x.id]?'true':'false'}">♥</button>${btnOf(x)}</div>
      </div></section>`; }).join('');
  f.hidden=false; document.body.classList.add('feeding'); f.scrollTop=keep; watchVids(f);
  $('#fx').onclick=()=>setLayout('masonry');
}
(function(){ const f=$('#feed'); let lastTap=0;
  f.addEventListener('click',e=>{
    const s=e.target.closest('.slide'); if(!s) return; const x=S.view[+s.dataset.i]; if(!x) return;
    if(e.target.closest('.add')){ fav(x); if(S.favs[x.id]) burst(s); return; }
    if(e.target.closest('a,button')) return;
    const now=Date.now();
    if(now-lastTap<300){ if(!S.favs[x.id]) fav(x); burst(s); lastTap=0; return; }
    lastTap=now;
    if(e.target.classList.contains('main') && x.media.length>1) setTimeout(()=>{ if(lastTap!==now) return;
      const k=((+s.dataset.m||0)+1)%x.media.length; s.dataset.m=k; s.querySelector('.main').outerHTML=mainOf(x.media[k],9); watchVids(s); s.querySelector('.mcount').textContent=(k+1)+'/'+x.media.length; },310);
  });
  f.addEventListener('scroll',()=>{ const i=Math.round(f.scrollTop/f.clientHeight); const fi=$('#fi'); if(fi) fi.textContent=Math.min(i+1,S.view.length); },{passive:true});
})();
function burst(s){ const p=s.querySelector('.pop'); p.classList.remove('go'); void p.offsetWidth; p.classList.add('go'); }
function setLayout(l){
  S.layout=l; $('#layout').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  if(l!=='feed'){ $('#feed').hidden=true; $('#feed').innerHTML=''; document.body.classList.remove('feeding'); document.body.style.overflow=''; }
  else { document.body.style.overflow='hidden'; $('#feed').scrollTop=0; }
  render();
}

/* ================= lightbox ================= */
function open(i){ if(i<0) return; S.i=i; S.m=0; $('#lb').classList.add('open'); document.body.style.overflow='hidden'; draw(); }
function close(){ const lv=$('#lbv'); lv.pause(); lv.removeAttribute('src'); lv.load(); $('#lb').classList.remove('open'); document.body.style.overflow=''; }
function step(d){ const n=S.view.length; if(!n) return; S.i=(S.i+d+n)%n; S.m=0; draw(); }
function draw(){
  const x=S.view[S.i]; if(!x) return close(); const m=x.media[S.m]||x.media[0];
  const lv=$('#lbv'); if(m.video){ $('#lbi').hidden=true; $('#lbi').removeAttribute('src'); lv.hidden=false; lv.poster=m.url; lv.muted=m.type==='gif'; lv.controls=m.type!=='gif'; if(lv.getAttribute('src')!==m.video) lv.src=m.video; lv.play().catch(()=>{lv.muted=true; lv.play().catch(()=>{});}); } else { lv.pause(); lv.hidden=true; lv.removeAttribute('src'); $('#lbi').hidden=false; $('#lbi').src=m.url; }
  const links = x.links.length ? `<div class="links">${x.links.map((l,k)=>`<a class="buy ${k?'ghost':''}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(linkLabel(l,x.links))} ↗</a>`).join('')}</div>` : '';
  $('#lba').innerHTML = `
    <a class="who" href="https://x.com/${esc(x.author.username)}" target="_blank" rel="noopener"><img src="${esc(x.author.avatar)}" alt=""><div><b>${esc(x.author.name)}${vf(x.author)}</b><span class="mono">@${esc(x.author.username)} · ${fmt(x.author.followers)} followers</span></div></a>
    ${links}
    <div class="tags">${tagsOf(x)}</div>
    <p class="full">${linkify(x.text)}</p>
    ${x.media.length>1?`<div class="thumbs">${x.media.map((mm,k)=>`<img data-k="${k}" class="${k===S.m?'on':''}" src="${esc(mm.thumb||mm.url)}">`).join('')}</div>`:''}
    ${statsOf(x,true)}
    <div class="acts"><a class="pill" href="${esc(x.url)}" target="_blank" rel="noopener">view on x</a><button class="pill" id="lbf">${S.favs[x.id]?'♥ in collect list':'♡ add to collect list'}</button></div>
    <span class="mono kbd">${S.i+1} / ${S.view.length} · ← → browse · f add</span>`;
  $('#lba').querySelectorAll('.thumbs img').forEach(t=>t.onclick=()=>{S.m=+t.dataset.k; draw();});
  $('#lbf').onclick=()=>{fav(x); draw();};
  [1,-1].forEach(d=>{const y=S.view[S.i+d]; if(y) new Image().src=y.media[0].url;});
}
$('#lbx').onclick=close; $('#lbp').onclick=()=>step(-1); $('#lbn').onclick=()=>step(1);
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(S.layout==='feed' && !$('#lb').classList.contains('open')){
    const f=$('#feed'), i=Math.round(f.scrollTop/f.clientHeight);
    if(e.key==='ArrowDown'||e.key==='j'){ e.preventDefault(); f.scrollTo({top:(i+1)*f.clientHeight,behavior:'smooth'}); }
    if(e.key==='ArrowUp'||e.key==='k'){ e.preventDefault(); f.scrollTo({top:(i-1)*f.clientHeight,behavior:'smooth'}); }
    if(e.key.toLowerCase()==='f'){ const x=S.view[i]; if(x){ fav(x); if(S.favs[x.id]) burst(f.querySelectorAll('.slide')[i]); } }
    if(e.key==='Escape') setLayout('masonry');
    return;
  }
  if(!$('#lb').classList.contains('open')) return;
  if(e.key==='Escape') close(); if(e.key==='ArrowRight') step(1); if(e.key==='ArrowLeft') step(-1);
  if(e.key.toLowerCase()==='f'){ fav(S.view[S.i]); draw(); }
});
let tx=null; $('#lb').addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
$('#lb').addEventListener('touchend',e=>{ if(tx==null) return; const d=e.changedTouches[0].clientX-tx; if(Math.abs(d)>50) step(d<0?1:-1); tx=null; });

/* ================= controls ================= */
(function(){ fetch(SSB+'/api/hot').then(r=>r.json()).then(j=>{ let L=(j.items||[]).slice(0,14); if(!L.length) return;
  while(L.length<5) L=L.concat(L);                       // enough rows to fill the wheel
  const h=$('#hot'), R=h.querySelector('.rows'), n=L.length;
  R.innerHTML=L.map(t=>`<a class="hth" href="https://x.com/${esc(t.u)}/status/${esc(t.id)}" target="_blank" rel="noopener">${t.av?`<img src="${esc(t.av)}" alt="">`:''}<span><b>@${esc(t.u)}${vf({vtype:t.vt})}</b><span class="mono">${esc((t.t||'').slice(0,70))}</span></span></a>`).join('');
  const els=[...R.children]; let c=0, paused=false;
  const place=()=>els.forEach((el,i)=>{ let d=((i-c)%n+n)%n; if(d>n/2) d-=n;   // -2..2 around the pill
    const far=Math.abs(d)>2, jump=el._d!=null&&Math.abs(d-el._d)>1; el._d=d; el.style.transition=(far||jump)?'none':''; el.style.transform=`translateY(${d*36}px) rotateX(${-d*28}deg) scale(${1-Math.abs(d)*.08})`;
    el.style.opacity=far?0:Math.abs(d)===0?1:Math.abs(d)===1?.45:.15; el.classList.toggle('on',d===0); });
  place(); h.hidden=false;
  const W=$('#wheel'); W.onpointerenter=e=>{ if(e.pointerType==='mouse') paused=true; }; W.onpointerleave=()=>paused=false;
  let lastMove=Date.now(); const go=k=>{ c=((c+k)%n+n)%n; place(); lastMove=Date.now(); };
  let acc=0, wl=0; W.addEventListener('wheel',e=>{ e.preventDefault(); acc+=e.deltaY; const now=Date.now(); if(Math.abs(acc)>=30&&now-wl>160){ go(acc>0?1:-1); acc=0; wl=now; } },{passive:false});
  let ty=null, moved=false; W.addEventListener('touchstart',e=>{ ty=e.touches[0].clientY; moved=false; paused=true; },{passive:true});
  W.addEventListener('touchmove',e=>{ if(ty==null) return; const d=e.touches[0].clientY-ty; if(Math.abs(d)>8) e.preventDefault(); if(Math.abs(d)>=28){ go(d<0?1:-1); ty=e.touches[0].clientY; moved=true; } },{passive:false});
  W.addEventListener('touchend',e=>{ ty=null; paused=false; if(moved) e.preventDefault(); },{passive:false});
  W.addEventListener('click',e=>{ if(moved){ e.preventDefault(); moved=false; } },true);
  setInterval(()=>{ if(paused||document.hidden||document.body.classList.contains('loaded')||Date.now()-lastMove<4000) return; c=(c+1)%n; place(); lastMove=Date.now(); },500);
}).catch(()=>{}); })();
$('#f').onsubmit=e=>{
  e.preventDefault(); $('#err').textContent='';
  const id=parseId($('#u').value); if(!id){ $('#err').textContent='paste a link to an x post'; return; }
  Object.assign(S,{id,root:null,items:[],next:null,pages:0}); S.els.clear(); S.filters.clear(); $('#root').innerHTML='';
  try{ const q='?t='+id+(DEMO&&location.protocol!=='file:'?'&demo':''); (location.search.includes('t=')?history.replaceState:history.pushState).call(history,{t:id},'',q); }catch(_){}
  load();
};
function goHome(push){
  if(S.layout==='feed') setLayout('masonry');
  close(); $('#drawer').classList.remove('open'); $('#morepop').classList.remove('open');
  Object.assign(S,{id:null,root:null,items:[],next:null,pages:0,view:[],q:'',plat:'',mode:0}); S.els.clear(); S.filters.clear();
  $('#gal').innerHTML=''; $('#root').innerHTML=''; $('#count').textContent=''; $('#u').value=''; $('#err').textContent='';
  $('#more').hidden=true; $('#empty').hidden=true; $('#cl').hidden=true; $('#prog').style.width='0';
  document.body.classList.remove('loaded'); bgPlay(true); window.scrollTo(0,0);
  if(push!==false){ try{ history.pushState(null,'',location.pathname+(DEMO&&location.protocol!=='file:'?'?demo':'')); }catch(_){} }
  setTimeout(()=>$('#u').focus(),50);
}
$('h1').onclick=()=>goHome();
window.addEventListener('popstate',()=>{ const t=new URLSearchParams(location.search).get('t');
  if(!t) goHome(false); else if(t!==S.id){ $('#u').value='https://x.com/i/status/'+t; $('#f').requestSubmit(); } });
$('#layout').onclick=e=>{ const l=e.target.dataset.l; if(l) setLayout(l); };

$('#more').onclick=()=>{ S.pages=0; load(); };
drawSorts(); setMode(0,true);
const pre=new URLSearchParams(location.search).get('t'); if(pre){ $('#u').value='https://x.com/i/status/'+pre; $('#f').requestSubmit(); }
